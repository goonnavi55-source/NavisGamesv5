<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NavisGamesV5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@500;600;700&family=Yellowtail&display=swap">
<style>
:root{
  /* Layout: a small browser. A tab rail runs down the left edge (Home plus every opened tab).
     Home is one centered column: script logo, search, three tiles, trending pill. Games is a searchable catalog.
     Dark single-look design with a slow wave background. */
  --bg:#040406;
  --ink:#f3f4f7;
  --ink-dim:#9b9eaa;
  --ink-faint:#5f626e;
  --surface:rgba(255,255,255,.04);
  --surface-hi:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,255,255,.2);
  --accent:#9fdcff;
  --danger:#ff7a7a;
  --glow-1:58,98,190;
  --glow-2:34,124,148;
  --glow-3:150,84,52;
  --font-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-logo:'Yellowtail','Brush Script MT','Segoe Script',cursive;
  --font-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --rail:224px;
  --railw:calc(var(--rail) + env(safe-area-inset-left,0px));
  color-scheme:dark;
}
@media (max-width:820px){:root{--rail:60px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:500 14px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* background */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.sky canvas{display:block;width:100%;height:100%}

/* shell */
.app{position:relative;z-index:1;height:100%}
.rail{position:fixed;z-index:5;top:0;left:0;bottom:0;width:var(--railw);display:flex;flex-direction:column;gap:4px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
  background:rgba(6,7,11,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-right:1px solid var(--line);box-shadow:12px 0 40px rgba(0,0,0,.45);
  transform:translateX(-100%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
.rail.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.edge{position:fixed;z-index:4;left:0;top:0;bottom:0;width:calc(22px + env(safe-area-inset-left,0px));display:flex;align-items:center;padding:0 0 0 calc(4px + env(safe-area-inset-left,0px));border:0;background:none;cursor:pointer}
.edge::before{content:"";width:4px;height:64px;border-radius:4px;background:var(--ink-faint);transition:background .2s,height .2s}
.edge:hover::before,.edge:focus-visible::before{background:var(--accent);height:92px}
.rail.open + .edge{visibility:hidden}
.brand{height:46px;display:flex;align-items:center;padding:0 10px;font:400 32px/1 var(--font-logo);color:var(--ink);text-shadow:0 0 14px rgba(159,220,255,.35);white-space:nowrap}
.brand .bm{display:none}
.rail-label{margin:12px 10px 6px;font:500 10.5px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.tabs{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:auto}
.tabrow{display:flex;align-items:center;border-radius:12px;transition:background .15s}
.tabrow:hover{background:var(--surface)}
.tabrow.on{background:var(--surface-hi)}
.tab{flex:1;min-width:0;display:flex;align-items:center;gap:11px;height:40px;padding:0 10px;border:0;border-radius:12px;background:none;color:var(--ink-dim);font:600 13px var(--font-ui);text-align:left;cursor:pointer}
.tabrow.on .tab,.tab:hover{color:var(--ink)}
.tab svg{width:18px;height:18px;flex:none}
.tab span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabx{flex:none;display:grid;place-items:center;width:28px;height:28px;margin-right:6px;border:0;border-radius:8px;background:none;color:var(--ink-faint);cursor:pointer}
.tabx:hover{background:var(--surface-hi);color:var(--ink)}
.tabx svg{width:13px;height:13px}
@media (max-width:820px){
  .rail{padding-left:calc(8px + env(safe-area-inset-left,0px));padding-right:8px;align-items:stretch}
  .brand{justify-content:center;padding:0;font-size:30px}
  .brand .bf{display:none}.brand .bm{display:inline}
  .rail-label{display:none}
  .tab{justify-content:center;padding:0}
  .tab span,.tabx{display:none}
}

.main{height:100%;display:flex;flex-direction:column;min-width:0}
.view{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}

/* home */
.home{display:flex;flex-direction:column;align-items:center}
.home-in{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:24px 36px}
.logowrap{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;max-width:100%}
.logowrap::before{content:"";position:absolute;z-index:-1;inset:-35% -20% -15%;pointer-events:none;opacity:.75;background:radial-gradient(closest-side,rgba(159,220,255,.17),rgba(159,220,255,0))}
.logo{--w:100;margin:0;padding:.14em .42em;font:400 clamp(52px,10vw,78px)/1.1 var(--font-logo);text-align:center;text-shadow:0 0 10px rgba(159,220,255,.28);overflow-wrap:anywhere;
  -webkit-mask-image:linear-gradient(100deg,#000 calc(var(--w)*1%),transparent calc(var(--w)*1% + 8%));
  mask-image:linear-gradient(100deg,#000 calc(var(--w)*1%),transparent calc(var(--w)*1% + 8%))}
.pen{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;
  box-shadow:0 0 12px 5px rgba(159,220,255,.85),0 0 34px 12px rgba(159,220,255,.35);transition:opacity .25s}
.swash{display:block;width:min(300px,64%);height:20px;margin-top:-10px;color:var(--accent);overflow:visible}
.swash path{stroke-dasharray:1;stroke-dashoffset:0}
.curtain{position:fixed;inset:0;z-index:40;background:#000;pointer-events:none}
.search{position:relative;width:min(500px,100%);height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid var(--line-hi);border-radius:14px;background:var(--surface);transition:border-color .2s,background .2s,box-shadow .2s}
.search svg{width:16px;height:16px;flex:none;color:var(--ink-dim)}
.search:focus-within{border-color:rgba(159,220,255,.55);background:var(--surface-hi);box-shadow:0 0 0 4px rgba(159,220,255,.08)}
.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:500 16px var(--font-ui)}
.search input::placeholder{color:var(--ink-dim)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:500 11px var(--font-mono);color:var(--ink-faint);border:1px solid var(--line);border-radius:6px;padding:2px 7px}

.grid{--tile:84px;--gap:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap);width:100%;max-width:calc(var(--tile)*5 + var(--gap)*4 + 2px)}
.tile{width:var(--tile);height:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 3px;background:var(--surface);border:1px solid var(--line);border-radius:18px;color:var(--ink);font:700 11.5px/1 var(--font-ui);text-decoration:none;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}
.tile svg{width:28px;height:28px}
.tile span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:hover{background:var(--surface-hi);border-color:var(--line-hi);transform:translateY(-2px)}
.tile.add{border-style:dashed;color:var(--ink-dim)}
.mono{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid currentColor;font:700 13px var(--font-ui)}

.trend{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(520px,100%)}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border:1px solid var(--line-hi);border-radius:999px;background:var(--surface);font:700 11.5px var(--font-ui);cursor:pointer;transition:background .18s}
.pill:hover{background:var(--surface-hi)}
.pill svg{width:12px;height:12px}
.trendlist{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font:600 12px var(--font-ui);text-decoration:none;cursor:pointer}
.chip:hover{background:var(--surface-hi)}
.muted{margin:0;color:var(--ink-dim);font-size:12.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border:1px solid transparent;border-radius:11px;background:var(--ink);color:#07080b;font:700 13px var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:#fff}
.btn.ghost{background:transparent;border-color:var(--line-hi);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-hi)}
.btn.danger{background:var(--danger);color:#240808}
.btn.sm{height:32px;padding:0 14px;font-size:12.5px;border-radius:10px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns.center{justify-content:center}
.linkbtn{border:0;background:none;color:var(--ink-dim);font:600 12.5px var(--font-ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:hover{color:var(--danger)}

/* games */
.gtop{position:sticky;top:0;z-index:3;display:flex;flex-direction:column;gap:10px;padding:16px 0 10px;background:rgba(4,4,6,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ghead{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
.ghead h2{margin:0;font:700 22px var(--font-ui)}
.gcount{flex:1;min-width:60px;color:var(--ink-dim);font:400 12px var(--font-mono)}
.gtools{display:flex;flex-wrap:wrap;gap:10px}
.gsearch{flex:1 1 220px;min-width:0;height:42px;display:flex;align-items:center;gap:9px;padding:0 13px;border:1px solid var(--line-hi);border-radius:12px;background:var(--surface)}
.gsearch:focus-within{border-color:rgba(159,220,255,.55);background:var(--surface-hi)}
.gsearch svg{width:15px;height:15px;flex:none;color:var(--ink-dim)}
.gsearch input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink);font:500 16px var(--font-ui)}
.gsearch input::placeholder{color:var(--ink-dim)}
.letters{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lt{flex:none;min-width:30px;height:30px;padding:0 6px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink-dim);font:600 12px var(--font-ui);cursor:pointer}
.lt:hover:not(:disabled){background:var(--surface-hi);color:var(--ink)}
.lt[aria-pressed="true"]{background:var(--ink);color:#07080b;border-color:transparent}
.lt:disabled{opacity:.28;cursor:default}
.gbody{padding-block:6px 28px}
.glist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.game{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(9,10,15,.74)}
.gname{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.gname b{font:600 14px/1.25 var(--font-ui);overflow-wrap:anywhere}
.gname small{font:500 11px var(--font-ui);color:var(--ink-dim)}
.gico{position:relative;flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:13px;overflow:hidden;background:linear-gradient(140deg,hsl(var(--h1) 60% 34%),hsl(var(--h2) 64% 21%));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.gico i{position:absolute;pointer-events:none}
.gico b{position:relative;font:700 19px/1 var(--font-ui);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.gico.s0 i{right:-9px;top:-9px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.17)}
.gico.s1 i{inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 4px,transparent 4px 10px)}
.gico.s2 i{left:-8px;bottom:-8px;width:30px;height:30px;border-radius:8px;transform:rotate(25deg);background:rgba(0,0,0,.22)}
.gico.s3 i{left:0;right:0;bottom:0;height:13px;background:rgba(0,0,0,.24)}
.gact{display:flex;gap:6px;flex:none}
.gempty{margin:28px 0;text-align:center;color:var(--ink-dim)}
.gmore{display:flex;margin:18px auto 0}
.gnote{margin:22px 0 0;color:var(--ink-faint);font-size:12px;line-height:1.55;max-width:70ch}
.gnote a{color:var(--ink-dim)}

/* launch card (Movies and custom links) */
.launch{display:flex}
.lcard{margin:auto;width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 24px;border:1px solid var(--line-hi);border-radius:22px;background:rgba(9,10,15,.76);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);text-align:center}
.lico{display:grid;place-items:center;width:56px;height:56px;border:1px solid var(--line-hi);border-radius:16px;background:var(--surface)}
.lico svg{width:26px;height:26px}
.lcard h2{margin:2px 0 0;font:700 24px var(--font-ui)}
.lurl{margin:0;font:500 13px var(--font-mono);color:var(--accent);overflow-wrap:anywhere}
.lnote{margin:0 0 6px;color:var(--ink-dim);max-width:34ch}

/* dock */
.dock{flex:none;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px 18px;padding:4px 0 8px}
.dock button{display:inline-flex;align-items:center;gap:6px;padding:7px 2px;border:0;border-radius:8px;background:none;color:var(--ink-dim);font:600 12px var(--font-ui);cursor:pointer;transition:color .15s}
.dock button:hover,.dock button[aria-expanded="true"]{color:var(--ink)}
.dock button.danger{color:var(--danger)}
.dock button.danger:hover,.dock button.danger[aria-expanded="true"]{color:#ffa3a3}
.dock svg{width:13px;height:13px}
@media (max-width:560px){.dock{justify-content:center;gap:2px 12px}}

/* panels */
.panel{position:fixed;z-index:8;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(48px + env(safe-area-inset-bottom,0px));
  width:min(344px,calc(100vw - 32px));max-height:min(72vh,540px);overflow:auto;padding:18px;border:1px solid var(--line-hi);border-radius:18px;
  background:rgba(12,13,18,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 50px rgba(0,0,0,.55);outline:0}
.panel h2{margin:0 0 12px;font:700 15px var(--font-ui)}
.panel h3{margin:16px 0 8px;font:600 12px var(--font-ui);color:var(--ink-dim)}
.panel p{margin:0 0 12px}
.list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.list li>span:first-child{flex:none}
.list a,.list .grow{flex:1;min-width:0;color:var(--ink);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list small{display:block;color:var(--ink-dim);font:400 11px var(--font-mono);overflow:hidden;text-overflow:ellipsis}
.x{flex:none;display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:8px;background:none;color:var(--ink-dim);cursor:pointer}
.x:hover{background:var(--surface-hi);color:var(--ink)}
.x svg{width:14px;height:14px}
.panel label{display:block;margin:0 0 6px;color:var(--ink-dim);font:600 12px var(--font-ui)}
.in{width:100%;height:42px;margin:0 0 12px;padding:0 12px;border:1px solid var(--line-hi);border-radius:11px;background:rgba(255,255,255,.04);color:var(--ink);font:500 16px var(--font-ui)}
.in:focus{outline:0;border-color:rgba(159,220,255,.6)}
.err{min-height:18px;margin:10px 0 0!important;color:var(--danger);font-size:12.5px}
.field{margin:0 0 14px}
.field>span{display:block;margin:0 0 6px;color:var(--ink-dim);font:600 12px var(--font-ui)}
.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}
.seg button{flex:1;min-width:0;height:34px;padding:0 10px;border:0;border-radius:9px;background:none;color:var(--ink-dim);font:600 12px var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink);color:#07080b}
.gtools .seg{flex:none}
.gtools .seg button{flex:none;padding:0 14px}

.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);padding:10px 16px;border:1px solid var(--line-hi);border-radius:999px;background:rgba(14,15,20,.96);font:600 13px var(--font-ui)}

/* intro: lights come on, the name writes itself, the rest pops in */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:translateY(26px) scale(.5)}55%{opacity:1;transform:translateY(-5px) scale(1.08)}78%{transform:translateY(1px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes glowIn{0%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1.12)}100%{opacity:.75;transform:scale(1)}}
.boot .logowrap::before{animation:glowIn 2.4s ease .7s backwards}
.boot .swash path{animation:draw 1.1s cubic-bezier(.5,0,.2,1) 2.7s backwards}
.boot .search{animation:rise .8s cubic-bezier(.2,.8,.2,1) 2.5s backwards}
.boot .tile{animation:popIn .8s cubic-bezier(.2,.9,.3,1.2) calc(3s + var(--i,0)*75ms) backwards}
.boot .pill{animation:rise .7s ease 3.9s backwards}
.boot .dock{animation:fade .8s ease 4.2s backwards}


.boot .main{pointer-events:none}
.boot .edge{animation:fade .8s ease 4.2s backwards}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

<div class="curtain" id="curtain" aria-hidden="true"></div>
<div class="sky" aria-hidden="true"><canvas id="bg"></canvas></div>

<div class="app">
  <nav class="rail" aria-label="Tabs">
    <div class="brand" aria-hidden="true"><span class="bf">Navis</span><span class="bm">N</span></div>
    <p class="rail-label">Tabs</p>
    <div class="tabs" id="tabList" role="tablist" aria-orientation="vertical" aria-label="Open tabs"></div>
  </nav>
  <button type="button" class="edge" id="edge" aria-label="Show tabs" aria-expanded="false" aria-controls="tabList"></button>

  <div class="main">
    <section class="view home" id="v-home" role="tabpanel">
      <div class="home-in">
        <div class="logowrap" id="logowrap">
          <h1 class="logo" id="logo">NavisGamesV5</h1>
          <span class="pen" id="pen" aria-hidden="true"></span>
          <svg class="swash" viewBox="0 0 320 22" aria-hidden="true"><defs><linearGradient id="swg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset=".28" stop-color="currentColor" stop-opacity=".95"/><stop offset=".72" stop-color="currentColor" stop-opacity=".95"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="M6 13C62 3 128 21 196 10s98-6 118 2" pathLength="1" fill="none" stroke="url(#swg)" stroke-width="2.2" stroke-linecap="round"/></svg>
        </div>

        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="q" type="search" placeholder="Search games or paste a link…" aria-label="Search games or open a link" enterkeyhint="go" autocomplete="off" spellcheck="false">
          <kbd aria-hidden="true">/</kbd>
        </form>

        <nav class="grid" id="grid" aria-label="Shortcuts"></nav>

  state.nextId=Math.max(+state.nextId||1,state.links.reduce((m,l)=>Math.max(m,l.id),0)+1);

}

/* ---------- animated background: slow waves ---------- */
const MOTION={off:0,drift:.4,slow:1,steady:2};
const Bg=(function(){

  }
  function draw(dt){
    g.fillStyle=BGC;g.fillRect(0,0,W,H);

    full:function(){ramp=null;lv=1;kick();}
  };
})();

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function initial(name){
  const w=name.trim().replace(/^(the|a|an)\s+(?=\S)/i,'');
  const m=Array.from(w).find(c=>/[\p{L}\p{N}]/u.test(c));
  return (m||'#').toUpperCase();
}

  const h=hash(name),h1=h%360,h2=(h1+35+(h>>>8)%50)%360;
  return '<span class="gico s'+((h>>>16)%4)+'" aria-hidden="true" style="--h1:'+h1+';--h2:'+h2+'"><i></i><b>'+esc(initial(name))+'</b></span>';
}

  if(isNew)Rail.peek();
}

/* ---------- retractable tab rail ---------- */
const Rail=(function(){
  const rail=$('.rail'),edge=$('#edge');
  let open=false,pinned=false,timer=0,peekT=0,lastX=99999;
  const reach=()=>rail.offsetWidth+36;
  const kbFocus=()=>!!rail.querySelector(':focus-visible');
  function set(v){
    if(open===v)return;
    open=v;rail.classList.toggle('open',v);edge.setAttribute('aria-expanded',String(v));
    if(!v)pinned=false;
  }
  function later(){
    clearTimeout(timer);
    timer=setTimeout(function(){if(!pinned&&!kbFocus())set(false);},340);
  }
  document.addEventListener('pointermove',function(e){
    if(e.pointerType==='touch'||document.body.classList.contains('boot'))return;
    lastX=e.clientX;
    if(e.clientX<=(open?reach():28)){clearTimeout(timer);clearTimeout(peekT);set(true);}
    else if(open&&!pinned)later();
  },{passive:true});
  document.documentElement.addEventListener('mouseleave',function(){lastX=99999;if(open&&!pinned)later();});
  document.addEventListener('pointerdown',function(e){
    if(open&&!rail.contains(e.target)&&e.target!==edge){clearTimeout(timer);set(false);}
  },true);
  rail.addEventListener('focusout',function(e){
    if(!rail.contains(e.relatedTarget)&&!pinned&&lastX>reach())later();
  });
  edge.addEventListener('click',function(){
    pinned=true;set(true);
    requestAnimationFrame(function(){const t=rail.querySelector('.tabrow.on .tab')||rail.querySelector('.tab');if(t)t.focus();});
  });
  return {
    close:function(){clearTimeout(timer);set(false);},
    isOpen:function(){return open;},
    select:function(){if(pinned)set(false);},
    peek:function(){
      if(open)return;
      set(true);clearTimeout(peekT);
      peekT=setTimeout(function(){if(!pinned&&lastX>reach()&&!kbFocus())set(false);},1700);
    }
  };
})();

  if(kind==='clear'){
    return '<h2>Erase local data?</h2><p class="muted">This removes your player name, recent games, saved links and settings from this browser.</p>'+
      '<div class="btns"><button type="button" class="btn danger" data-act="erase">Erase everything</button><button type="button" class="btn ghost" data-act="cancel">Cancel</button></div>';
  }
  return '';
}
function closePanel(){
  if(!panelKind)return;
  panelKind=null;panel.hidden=true;
  $$('.dock [data-panel]').forEach(b=>b.setAttribute('aria-expanded','false'));
}
function openPanel(kind,focusSel){
  panelKind=kind;panel.innerHTML=panelHTML(kind);panel.hidden=false;
  panel.setAttribute('aria-label',{links:'Add link',settings:'Settings',accounts:'Player profile',clear:'Erase local data'}[kind]||'Menu');
  $$('.dock [data-panel]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.panel===kind)));
  const f=focusSel&&panel.querySelector(focusSel);
  (f||panel).focus();
}
function removeLink(id){
  const i=state.links.findIndex(l=>l.id===id);if(i<0)return;
  state.links.splice(i,1);save();
  const tid='link-'+id;
  if(tabs.indexOf(tid)>-1){const wasActive=active===tid;tabs.splice(tabs.indexOf(tid),1);if(wasActive)show('home');else renderRail();}
  renderTiles();
}
$('.dock').addEventListener('click',function(e){
  const b=e.target.closest('[data-panel]');if(!b)return;
  if(panelKind===b.dataset.panel)closePanel();else openPanel(b.dataset.panel);
});
panel.addEventListener('click',function(e){
  const s=e.target.closest('[data-set]');
  if(s){
    const p=s.dataset.set.split(':');
    if(p[0]==='motion'){state.motion=p[1];Bg.kick();}
    if(p[0]==='intro')state.intro=p[1]==='1';
    save();openPanel('settings','[data-set="'+s.dataset.set+'"]');return;
  }
  const r=e.target.closest('[data-rmlink]');
  if(r){removeLink(+r.dataset.rmlink);if(panelKind==='links')openPanel('links');return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='cancel')closePanel();
  if(a.dataset.act==='replay-intro'){closePanel();openTab('home');Intro.play();}
  if(a.dataset.act==='erase'){
    state=fresh();
    try{localStorage.removeItem(KEY);}catch(err){}
    tabs=tabs.filter(id=>tabInfo(id));
    Object.assign(G,{q:'',filter:'playable',letter:'',shown:PAGE});$('#gq').value='';
    renderTiles();renderTrending();Bg.kick();closePanel();
    if(!tabInfo(active))show('home');else show(active);
    toast('Local data erased.');
  }
});
panel.addEventListener('submit',function(e){
  if(e.target.id!=='linkForm')return;
  e.preventDefault();
  const nm=$('#linkName').value.trim(),url=normUrl($('#linkUrl').value),err=$('#linkErr');
  if(!nm||!url){err.textContent='Enter a name and a web address, like example.com.';return;}
  if(state.links.length>=12){err.textContent='You can save up to 12 links. Remove one to add another.';return;}
  state.links.push({id:state.nextId++,name:nm.slice(0,20),url:url});save();renderTiles();openPanel('links','#linkName');
});
panel.addEventListener('input',function(e){
  if(e.target.id==='nameInput'){state.name=e.target.value.slice(0,24);save();}
});

/* ---------- global input ---------- */
document.addEventListener('click',function(e){
  const t=e.target;if(!t.closest)return;
  if(panelKind&&!t.closest('#panel')&&!t.closest('.dock'))closePanel();
  let el=t.closest('[data-open]');if(el){openTab(el.dataset.open);return;}
  el=t.closest('[data-tab]');if(el){openTab(el.dataset.tab);Rail.select();return;}
  el=t.closest('[data-close]');if(el){closeTab(el.dataset.close);return;}
  el=t.closest('[data-addlink]');if(el){openPanel('links','#linkName');return;}
  el=t.closest('#v-launch [data-rmlink]');if(el){removeLink(+el.dataset.rmlink);return;}
  el=t.closest('[data-play]');if(el&&el.href)recordPlay(el.dataset.play,el.href);
});
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(panelKind){closePanel();return;}
    if(Rail.isOpen()){Rail.close();return;}
    const f=document.activeElement;
    if(f&&(f.id==='q'||f.id==='gq')&&f.value){f.value='';if(f.id==='gq'){G.q='';G.shown=PAGE;renderGames();}}
    return;
  }
  const tag=document.activeElement&&document.activeElement.tagName;
  if(e.key==='/'&&tag!=='INPUT'&&tag!=='TEXTAREA'&&!e.metaKey&&!e.ctrlKey){
    if(active==='home'){e.preventDefault();q.focus();}
    else if(active==='games'){e.preventDefault();$('#gq').focus();}
  }
});

/* ---------- intro ---------- */
const Intro=(function(){
  const cur=$('#curtain'),wrap=$('#logowrap'),logo=$('#logo'),pen=$('#pen');
  const WT=[1.3,.9,.9,.7,.8,1.4,.9,1.2,.9,.8,1.3,1.1],TOT=WT.reduce(function(a,v){return a+v;},0);
  const T={lightA:200,lightB:2200,writeA:700,writeB:2700,end:5200};
  const sine=function(u){return .5-.5*Math.cos(Math.PI*u);};
  const eio=function(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;};
  function wp(u){
    const x=u*TOT;let acc=0;
    for(let i=0;i<WT.length;i++){
      if(x<=acc+WT[i]||i===WT.length-1){const f=clamp((x-acc)/WT[i],0,1);return (acc+sine(f)*WT[i])/TOT;}
      acc+=WT[i];
    }
    return 1;
  }
  let raf=0,t0=0,on=false,curDone=false,geo=null;
  function setW(p){logo.style.setProperty('--w',(-8+p*108).toFixed(2));}
  function curtain(u){
    if(u>=1){if(!curDone){cur.hidden=true;curDone=true;}return;}
    const R=3.6*geo.D*u;
    cur.style.background='radial-gradient(circle at '+geo.cx+'px '+geo.cy+'px,rgba(0,0,0,0) '+(R*.3)+'px,rgba(0,0,0,.94) '+(R*.8)+'px,#000 '+R+'px)';
  }
  function frame(now){
    const e=now-t0;
    curtain(eio(clamp((e-T.lightA)/(T.lightB-T.lightA),0,1)));
    const wu=clamp((e-T.writeA)/(T.writeB-T.writeA),0,1),p=wp(wu);
    setW(p);
    if(wu>0&&wu<1){
      const front=clamp((-8+p*108+3)/100,.02,.98);
      const wob=.58+.2*Math.sin(wu*52)+.08*Math.sin(wu*23);
      pen.style.transform='translate('+(geo.lx+geo.lw*front).toFixed(1)+'px,'+(geo.ly+geo.lh*wob).toFixed(1)+'px)';
      pen.style.opacity=1;
    }else pen.style.opacity=0;
    if(e>=T.end){end();return;}
    raf=requestAnimationFrame(frame);
  }
  function end(){
    on=false;cancelAnimationFrame(raf);
    setW(1);cur.hidden=true;curDone=true;pen.style.opacity=0;
    document.body.classList.remove('boot');
    window.removeEventListener('pointerdown',skip,true);
    window.removeEventListener('keydown',skip,true);
    Bg.full();
  }
  function skip(){if(on)end();}
  function play(){
    cancelAnimationFrame(raf);
    const bd=document.body;
    bd.classList.remove('boot');void bd.offsetWidth;bd.classList.add('boot');
    setW(0);pen.style.opacity=0;
    const W=window.innerWidth,H=window.innerHeight,lr=logo.getBoundingClientRect(),wr=wrap.getBoundingClientRect();
    const cx=lr.left+lr.width/2,cy=lr.top+lr.height/2;
    geo={cx:cx,cy:cy,D:Math.hypot(Math.max(cx,W-cx),Math.max(cy,H-cy)),lx:lr.left-wr.left,ly:lr.top-wr.top,lw:lr.width,lh:lr.height};
    cur.hidden=false;curDone=false;cur.style.background='#000';
    Bg.ramp(150,2600);
    t0=performance.now();on=true;
    window.addEventListener('pointerdown',skip,true);
    window.addEventListener('keydown',skip,true);
    raf=requestAnimationFrame(frame);
  }
  function start(){if(state.intro&&!reduced&&active==='home')play();else{cur.hidden=true;}}
  return {play:play,start:start};
})();



/* ---------- start ---------- */
renderTiles();renderTrending();renderRail();Bg.kick();
(function(){
  const h=location.hash.slice(1);
  if(h&&h!=='home'&&tabInfo(h)){openTab(h);$('#curtain').hidden=true;}
  else Intro.start();
})();
})();
</script>
